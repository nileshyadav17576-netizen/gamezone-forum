<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Gaming Forum</title>

    <!-- Styles (Aman) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
    <div class="header-content">
        <div class="logo">🎮 Game<span>Zone</span></div>

        <div class="profile">
            <div class="avatar" id="headerAvatar"></div>
            <span id="headerName"></span>
        </div>
    </div>
</header>


<!-- ===== NAVIGATION ===== -->
<nav>
    <div class="nav-content">
        <button class="active" data-view="home" onclick="setView('home')">🏠 Home</button>
        <button data-view="trending" onclick="setView('trending')">🔥 Trending</button>
        <button data-view="bookmarks" onclick="setView('bookmarks')">🔖 Bookmarks</button>
        <button onclick="openProfile()">👤 Profile</button>
    </div>
</nav>


<!-- ===== MAIN ===== -->
<div class="container">
    <div class="layout">

        <main>

            <!-- Search -->
            <div class="search-box">
                <input
                    type="text"
                    id="search"
                    placeholder="🔎 Search games, posts or users..."
                    aria-label="Search posts"
                    oninput="searchPosts()"
                >
            </div>

            <!-- Create post -->
            <div class="card">
                <h2>✍️ Create a Post</h2>
                <br>

                <textarea
                    id="postText"
                    placeholder="Share something with the gaming community..."
                    aria-label="Post text"
                ></textarea>

                <div class="create-row">
                    <select id="game" aria-label="Game category"></select>
                    <button class="primary" onclick="createPost()">Post</button>
                </div>
            </div>

            <!-- Filters (buttons are generated in features.js) -->
            <div class="filters" id="filters"></div>

            <!-- Posts (rendered by posts.js) -->
            <div id="posts"></div>

        </main>


        <aside>

            <div class="card sidebar">
                <h3>🔥 Popular Games</h3>

                <div class="game">
                    <span>🎯 Valorant</span>
                    <button data-game="Valorant" onclick="joinGame(this)">Join</button>
                </div>
                <div class="game">
                    <span>⛏️ Minecraft</span>
                    <button data-game="Minecraft" onclick="joinGame(this)">Join</button>
                </div>
                <div class="game">
                    <span>🚗 GTA V</span>
                    <button data-game="GTA V" onclick="joinGame(this)">Join</button>
                </div>
                <div class="game">
                    <span>🔫 CS2</span>
                    <button data-game="CS2" onclick="joinGame(this)">Join</button>
                </div>
                <div class="game">
                    <span>🪂 Fortnite</span>
                    <button data-game="Fortnite" onclick="joinGame(this)">Join</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title-row">
                    <h3>🔔 Notifications</h3>
                    <button class="clear-btn" onclick="clearNotifications()">Clear</button>
                </div>
                <div id="notifications"></div>
            </div>

            <div class="card">
                <h3>🏆 Community Stats</h3>
                <p class="stat">👥 Members: <b>12,450</b></p>
                <p class="stat">📝 Posts: <b id="postCount">0</b></p>
                <p class="stat">🔥 Online: <b>328</b></p>
            </div>

        </aside>

    </div>
</div>


<!-- ===== PROFILE MODAL ===== -->
<div class="modal" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <div class="modal-box">
        <button class="close" aria-label="Close profile" onclick="closeProfile()">×</button>

        <h2 id="profileTitle">👤 My Profile</h2>
        <br>
        <h3 id="profileName"></h3>
        <p class="muted">Gaming enthusiast</p>
        <br>
        <p>🏆 Reputation: <span id="myReputation">0</span></p>
        <p>📝 Posts: <span id="myPosts">0</span></p>
        <p>❤️ Likes received: <span id="myLikes">0</span></p>
    </div>
</div>


<!-- Scripts: posts.js must load before features.js -->
<script src="posts.js"></script>
<script src="features.js"></script>

</body>
</html>
